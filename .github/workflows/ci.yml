name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install project and optional MCP support
        run: uv sync --locked --extra mcp --python "${{ matrix.python-version }}"
      - name: Compile modules
        run: uv run --locked --extra mcp --python "${{ matrix.python-version }}" python -m compileall -q *.py tests
      - name: Unit tests
        run: uv run --locked --extra mcp --python "${{ matrix.python-version }}" pytest -q
      - name: CLI smoke test
        run: uv run --locked --extra mcp --python "${{ matrix.python-version }}" clip-content-engine --help
