[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-content-engine"
version = "0.2.0"
description = "Agent-neutral YouTube clip discovery, ranking and social drafts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PXMichael and contributors"}]
dependencies = ["yt-dlp[default]>=2026.10.26"]

[project.optional-dependencies]
mcp = ["mcp>=1.8,<2"]
whisper = ["faster-whisper>=1.2.1"]
faces = ["opencv-python-headless>=4.8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
clip-content-engine = "ce_cli:main"

[tool.setuptools]
py-modules = ["engine", "transcribe", "faces", "tools", "llm_ranking", "ce_api", "ce_cli", "mcp_server", "review_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
